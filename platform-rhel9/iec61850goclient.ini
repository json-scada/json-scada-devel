[program:iec61850goclient]
; IEC61850 client in Go: alternative executable for the IEC61850 driver (no libiec61850 needed).
; Enable EITHER iec61850client OR iec61850goclient for a given instance number, never both.
; args: instance# loglevel
command=/home/jsonscada/json-scada/bin/iec61850-client 1 1
autostart=false
numprocs=1                     ; number of processes copies to start (def 1)
directory=/home/jsonscada/json-scada/bin/                ; directory to cwd to before exec (def no cwd)
user=jsonscada                   ; setuid to this UNIX account to run the program
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/jsonscada/json-scada/log/iec61850goclient.log    ; stdout log path, NONE for none; default AUTO
stdout_logfile_maxbytes=10MB   ; max # logfile bytes b4 rotation (default 50MB)
stdout_logfile_backups=10     ; # of stdout logfile backups (0 means none, default 10)
stdout_capture_maxbytes=10MB   ; number of bytes in 'capturemode' (default 0)
