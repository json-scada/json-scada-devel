[program:nodered_runtime]
; Optional local Node-RED runtime. Install first with the install script's Node-RED
; block (node-red@4 + node-red-contrib-jsonscada into json-scada/nodered-runtime).
; The NODE-RED driver also works with a remote or containerized Node-RED.
command=/usr/bin/node /home/jsonscada/json-scada/nodered-runtime/node_modules/node-red/red.js -s /home/jsonscada/json-scada/conf/node-red-settings.js
autostart=false
numprocs=1
directory=/home/jsonscada/json-scada/nodered-runtime/
user=jsonscada
environment=JS_NODERED_USERDIR="/home/jsonscada/json-scada/conf/node-red",JS_NODERED_HOST="127.0.0.1",JS_NODERED_PORT="1880"
redirect_stderr=true
stdout_logfile=/home/jsonscada/json-scada/log/nodered_runtime.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stdout_capture_maxbytes=10MB
