[program:mcp_server]
; args: instance# loglevel
command=/usr/bin/node /home/jsonscada/json-scada/src/mcp-json-scada-db/dist/mcp-server.js
environment=JS_MCPJSDB_TRANSPORT="http",JS_MCPJSDB_IP_BIND="127.0.0.1",JS_MCPJSDB_HTTP_PORT="6001"  ; MCP over HTTP at http://127.0.0.1:6001
; to enable the configuration/process management tools, append an AdminUI admin account:
;   ,JS_MCPJSDB_ADMIN_USERNAME="mcp-admin",JS_MCPJSDB_ADMIN_PASSWORD="<password>"
autostart=false
numprocs=1                     ; number of processes copies to start (def 1)
directory=/home/jsonscada/json-scada/src/mcp-json-scada-db/                ; directory to cwd to before exec (def no cwd)
user=jsonscada                   ; setuid to this UNIX account to run the program
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/jsonscada/json-scada/log/mcp_server.log    ; stdout log path, NONE for none; default AUTO
stdout_logfile_maxbytes=10MB   ; max # logfile bytes b4 rotation (default 50MB)
stdout_logfile_backups=10     ; # of stdout logfile backups (0 means none, default 10)
stdout_capture_maxbytes=10MB   ; number of bytes in 'capturemode' (default 0)