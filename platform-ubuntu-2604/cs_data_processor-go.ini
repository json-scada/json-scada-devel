[program:cs_data_processor-go]
; Change Stream Data Processor in Go: alternative executable for CS_DATA_PROCESSOR (lower latency, no Node.js needed).
; Enable EITHER cs_data_processor OR cs_data_processor-go for a given instance number, never both.
; args: instance# loglevel
command=/home/jsonscada/json-scada/bin/cs_data_processor-go 1 1
autostart=false
numprocs=1                     ; number of processes copies to start (def 1)
directory=/home/jsonscada/json-scada/bin/                ; directory to cwd to before exec (def no cwd)
user=jsonscada                   ; setuid to this UNIX account to run the program
environment=JS_CSDATAPROC_METRICS_PORT="8082"  ; latency metrics on http://localhost:8082/metrics
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/jsonscada/json-scada/log/cs_data_processor.log    ; stdout log path, NONE for none; default AUTO
stdout_logfile_maxbytes=10MB   ; max # logfile bytes b4 rotation (default 50MB)
stdout_logfile_backups=10     ; # of stdout logfile backups (0 means none, default 10)
stdout_capture_maxbytes=10MB   ; number of bytes in 'capturemode' (default 0)
